# Reusable build-and-deploy onto an on-prem IIS site, run on a self-hosted Windows runner
# installed on the target web server: it builds the commit (.github/actions/build-app) and
# deploys the result in the same job, with no workflow artifacts (see docs/DEPLOYMENT.md).
#
# Per-environment settings live on the GitHub Environment, not in YAML:
#   Variables:  IIS_SITE_PATH       (required) physical path of the IIS site
#               SMOKE_TEST_URL      (optional) URL to GET after deploy
#               IIS_SITE_NAME       (optional) site name; when set, the site and app pool are
#                                   created on first deploy if missing (Initialize-IisSite.ps1)
#               IIS_APP_POOL        (optional) app pool name, defaults to IIS_SITE_NAME
#               IIS_BINDING         (needed to create the site) e.g. https:*:443:myapp.example.org
#               IIS_CERT_THUMBPRINT (https) certificate IT installed on the server - the usual
#                                   option while the organisation's web certificates are issued by hand
#               IIS_CERT_AUTO       (https, instead) "true" = request the certificate from an AD CS
#                                   CA and renew it within 40 days of expiry (Set-IisCertificate.ps1);
#                                   needs IIS_CERT_CA and IIS_CERT_TEMPLATE
#               IIS_CERT_DNS_NAMES  (optional, with IIS_CERT_AUTO) extra certificate names, space-separated
#               IIS_APP_POOL_USER   (optional) domain account (DOMAIN\user) for the app pool; default ApplicationPoolIdentity
#               SETUP_ANSWERS_FILE  (optional) repository path of the setup answers file; with APPENV_Ecp__Security__FailsafeAdmins__0__*
#                                   the deploy completes first-run setup without the wizard (ADR-0045)
#   Secrets:    IIS_APP_POOL_PASSWORD (with IIS_APP_POOL_USER)
#               PACK_SIGNING_KEY    (optional) private ES256 key (PEM) that signs the shipped packs at build time (ADR-0046);
#                                   with APPENV_Ecp__Packs__TrustedKeys__0__KeyId and __PublicKeyPem as variables
#   Variables prefixed APPENV_ are stamped into web.config as environment variables with the prefix
#   removed, e.g. APPENV_Ecp__Mode -> Ecp__Mode. Only VARIABLES are stamped: a secret would end up in
#   web.config in clear text, so this pipeline never reads secrets for that purpose. (The application
#   needs none: SQL Server uses integrated authentication, and any secret is a file or environment
#   reference resolved on the server.)
#
# Approval gates (e.g. who signs off Production) are the Environment's "Required reviewers".
#
# Callers must pass `secrets: inherit` so the Environment's secrets are visible here.
name: Deploy to IIS (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (QA, Production, ...). Also the default ASPNETCORE_ENVIRONMENT.
        type: string
        required: true
      runner-label:
        description: Label of the self-hosted runner on the target web server (e.g. iis-qa, iis-prod).
        type: string
        required: true
      aspnetcore-environment:
        description: ASPNETCORE_ENVIRONMENT value, if different from the environment name.
        type: string
        default: ""
      preserve-folders:
        description: Space-separated folder names in the site that hold runtime data and must not be overwritten or deleted.
        type: string
        default: "logs"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: [self-hosted, windows, "${{ inputs.runner-label }}"]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SMOKE_TEST_URL }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # Build here, on the web server's runner, straight into the deploy package: no workflow
      # artifacts (storage is shared across the account). QA and Production each build the
      # same commit (github.sha) with the same locked package versions.
      - name: Check out
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/build-app
        with:
          output-path: ${{ runner.temp }}/package
          pack-signing-key: ${{ secrets.PACK_SIGNING_KEY }}
          pack-key-id: ${{ vars.APPENV_Ecp__Packs__TrustedKeys__0__KeyId }}
          pack-public-key: ${{ vars.APPENV_Ecp__Packs__TrustedKeys__0__PublicKeyPem }}

      - name: Deploy
        shell: powershell
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          SITE_PATH: ${{ vars.IIS_SITE_PATH }}
          SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
          ASPNET_ENV: ${{ inputs.aspnetcore-environment || inputs.environment }}
          PRESERVE_FOLDERS: ${{ inputs.preserve-folders }}
          SITE_NAME: ${{ vars.IIS_SITE_NAME }}
          APP_POOL: ${{ vars.IIS_APP_POOL }}
          BINDING: ${{ vars.IIS_BINDING }}
          # Not sensitive, so it belongs in Variables, but accept a secret too (an easy mix-up).
          CERT_THUMBPRINT: ${{ vars.IIS_CERT_THUMBPRINT || secrets.IIS_CERT_THUMBPRINT }}
          CERT_AUTO: ${{ vars.IIS_CERT_AUTO }}
          CERT_CA: ${{ vars.IIS_CERT_CA }}
          CERT_TEMPLATE: ${{ vars.IIS_CERT_TEMPLATE }}
          CERT_DNS_NAMES: ${{ vars.IIS_CERT_DNS_NAMES }}
          APP_POOL_USER: ${{ vars.IIS_APP_POOL_USER }}
          APP_POOL_PASSWORD: ${{ secrets.IIS_APP_POOL_PASSWORD }}
          SETUP_ANSWERS_FILE: ${{ vars.SETUP_ANSWERS_FILE }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SITE_PATH) { throw "Set the IIS_SITE_PATH variable on the '${{ inputs.environment }}' environment." }

          # APPENV_-prefixed VARIABLES only. Values are never printed, only the names.
          $appEnv = @{}
          if ($env:ALL_VARS) {
            foreach ($p in ($env:ALL_VARS | ConvertFrom-Json).PSObject.Properties) {
              if ($p.Name -like "APPENV_*") { $appEnv[$p.Name.Substring(7)] = [string]$p.Value }
            }
          }
          Write-Host "Injecting $($appEnv.Count) app setting(s): $(($appEnv.Keys | Sort-Object) -join ', ')"

          # Fail safely before anything on the server is touched: a Production-mode installation needs these, and they are not guessed.
          foreach ($required in @("Ecp__Mode", "Ecp__DataDirectory", "Database__ConnectionString")) {
            if (-not $appEnv.ContainsKey($required) -or -not $appEnv[$required]) { throw "The '${{ inputs.environment }}' environment has no APPENV_$required variable. Set it (scripts/setup/setup-github-environments.sh lists every value)." }
          }
          if ($appEnv["Ecp__Mode"] -eq "Demo") { throw "Ecp__Mode is Demo. A deployed environment must not run in Demo mode." }
          if ($appEnv.ContainsKey("Database__ConnectionString") -and $appEnv["Database__ConnectionString"] -match "(?i)(password|pwd)\s*=") { throw "Database__ConnectionString contains a password. Use Windows integrated authentication (no credential in the string)." }

          $split = { param($s) @($s -split '\s+' | Where-Object { $_ }) }

          # Runs a command of the new build with the same settings IIS gives the site (the APPENV_ values), as this runner's account (the migration identity).
          $appDll = "$env:RUNNER_TEMP\package\app\Ecp.Host.dll"
          $runApp = {
            param([string[]]$cliArgs)
            foreach ($k in $appEnv.Keys) { [Environment]::SetEnvironmentVariable($k, $appEnv[$k], "Process") }
            $env:ASPNETCORE_ENVIRONMENT = $env:ASPNET_ENV
            & dotnet $appDll @cliArgs | Out-Host
            return $LASTEXITCODE
          }

          # Schema first, before any file is copied (ADR-0045): a fresh database is created; a current one is left alone; an installed database that this release
          # would change stops the deploy here, with the old site still running, until the upgrade runbook has been followed.
          $code = & $runApp @("deploy-migrate")
          if ($code -ne 0) { throw "deploy-migrate failed (exit $code). Nothing was deployed." }

          & "$env:GITHUB_WORKSPACE\scripts\ci\Deploy-IisSite.ps1" `
            -PackagePath "$env:RUNNER_TEMP\package\app" `
            -SitePath $env:SITE_PATH `
            -Environment $env:ASPNET_ENV `
            -EnvironmentVariables $appEnv `
            -PreserveFolders (& $split $env:PRESERVE_FOLDERS) `
            -SmokeTestUrl $env:SMOKE_TEST_URL `
            -SiteName $env:SITE_NAME `
            -AppPoolName $env:APP_POOL `
            -Binding $env:BINDING `
            -CertificateThumbprint $env:CERT_THUMBPRINT `
            -CertificateAuto:($env:CERT_AUTO -eq "true") `
            -CertificateAuthority $env:CERT_CA `
            -CertificateTemplate $env:CERT_TEMPLATE `
            -CertificateDnsNames (& $split $env:CERT_DNS_NAMES) `
            -AppPoolUser $env:APP_POOL_USER `
            -AppPoolPassword $env:APP_POOL_PASSWORD `
            -DataPath $appEnv["Ecp__DataDirectory"] `
            -LogPath $appEnv["Ecp__Logging__Directory"] `
            -KeyPath $appEnv["Ecp__DataProtection__KeyDirectory"]

          # First-run setup without the wizard (ADR-0045): the same setup stages, driven from the SETUP_ANSWERS_FILE answers file, with the administrators taken
          # from APPENV_Ecp__Security__FailsafeAdmins__N__Account/DisplayName/Email. Once setup is complete this only keeps those administrators in place.
          $answers = if ($env:SETUP_ANSWERS_FILE) { Join-Path $env:GITHUB_WORKSPACE $env:SETUP_ANSWERS_FILE } else { $null }
          if (-not $answers) { Write-Host "No SETUP_ANSWERS_FILE variable on this environment; setup-apply skipped." }
          elseif (-not (Test-Path $answers)) { throw "SETUP_ANSWERS_FILE '$env:SETUP_ANSWERS_FILE' is not in the repository." }
          elseif (-not $appEnv.ContainsKey("Ecp__Security__FailsafeAdmins__0__Account")) { Write-Host "::warning::No APPENV_Ecp__Security__FailsafeAdmins__0__Account on this environment; setup-apply skipped." }
          else {
            $code = & $runApp @("setup-apply", "--answers", $answers)
            if ($code -eq 3) { Write-Host "::warning::Setup is not complete yet; the step list above says what is waiting. Re-run this workflow once it is resolved." }
            elseif ($code -ne 0) { throw "setup-apply failed (exit $code). The new build is deployed; setup is unchanged where a step failed." }
          }

      - name: Clean up package
        if: always()
        shell: powershell
        run: Remove-Item "$env:RUNNER_TEMP\package" -Recurse -Force -ErrorAction SilentlyContinue

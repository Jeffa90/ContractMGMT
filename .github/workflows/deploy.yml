# JBS Contracts: once CI is green on the commit, build the package on a GitHub-hosted runner, then deploy it to QA
# on the QA server's runner. Production runs only when someone starts this workflow by hand on main with
# promote-to-production ticked, and then only after the Production environment's required reviewer approves.
# A push never starts Production. Setup and server facts: docs/jbs/QA_CONFIGURATION_RECORD.md and
# jbs-contracts/docs/product-spec.md (section 16).
#
# While the new app is being built (decision D-20) it deploys to QA from the redesign branch. main is frozen for
# code until redesign is merged, because a code push to main would deploy the old app over it.
name: Deploy

on:
  push:
    branches: [redesign, main]
    paths:
      - "jbs-contracts/**"
      - "!jbs-contracts/docs/**"
      - "!**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/iis-deploy.yml"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      promote-to-production:
        description: Also deploy to Production after QA succeeds (still needs the Production environment's required reviewer). Only from main.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # CI is not repeated here: wait for ci.yml to finish GREEN on this exact commit, and do nothing otherwise.
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)"
            case "$row" in
              "completed success") echo "CI is green for $SHA."; exit 0 ;;
              "completed "*) echo "::error::CI finished as '${row#completed }' for $SHA. Nothing is deployed."; exit 1 ;;
              "") echo "No CI run found yet for $SHA (attempt $attempt)." ;;
              *) echo "CI is $row for $SHA (attempt $attempt)." ;;
            esac
            sleep 30
          done
          echo "::error::CI did not finish green within 60 minutes for $SHA. Nothing is deployed."; exit 1

  # One package per commit, built once on a GitHub-hosted runner so the JBS server needs no Node.js or .NET SDK
  # (only the .NET Hosting Bundle). Kept for one day only. Every file is recorded in build-manifest.json and
  # checked on the server before anything changes (scripts/ci/Test-BuildManifest.ps1).
  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jbs-contracts/web/package-lock.json
      - name: Build the front end (into the API's wwwroot)
        working-directory: jbs-contracts/web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jbs-contracts/global.json
      - name: Publish the API
        working-directory: jbs-contracts
        run: |
          set -euo pipefail
          dotnet restore api/JbsContracts.Api.csproj --locked-mode
          dotnet publish api/JbsContracts.Api.csproj -c Release --no-restore -o "$RUNNER_TEMP/package/app"
          test -f "$RUNNER_TEMP/package/app/wwwroot/index.html" || { echo "::error::The front end is missing from the package."; exit 1; }
          mkdir -p "$RUNNER_TEMP/package/database"
          cp database/*.sql "$RUNNER_TEMP/package/database/"
      - name: Record the build manifest (commit, run and a SHA-256 for every file)
        env:
          APP: ${{ runner.temp }}/package/app
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, datetime
          app = os.environ["APP"]
          files = []
          for root, _, names in os.walk(app):
              for name in names:
                  path = os.path.join(root, name)
                  rel = os.path.relpath(path, app).replace(os.sep, "/")
                  if rel in ("web.config", "build-manifest.json"):
                      continue
                  with open(path, "rb") as f:
                      files.append({"path": rel, "sha256": hashlib.sha256(f.read()).hexdigest()})
          files.sort(key=lambda f: f["path"])
          manifest = {"commit": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"],
                      "builtUtc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "files": files}
          with open(os.path.join(app, "build-manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=1)
          print(f"{len(files)} files recorded")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: jbs-contracts-package
          path: ${{ runner.temp }}/package
          retention-days: 1
          if-no-files-found: error

  deploy-qa:
    needs: build
    uses: ./.github/workflows/iis-deploy.yml
    with:
      environment: QA
      runner-label: iis-qa
      preserve-folders: logs
    secrets: inherit

  deploy-prod:
    needs: deploy-qa
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.promote-to-production
    uses: ./.github/workflows/iis-deploy.yml
    with:
      environment: Production
      runner-label: iis-prod
      preserve-folders: logs
    secrets: inherit

# Reusable deploy of the JBS Contracts package onto an on-prem IIS site, run on the self-hosted Windows runner
# installed on the target web server (decision D-20). The package is built once by deploy.yml ("build" job).
#
# Per-environment settings live on the GitHub Environment, not in YAML (see docs/jbs/QA_CONFIGURATION_RECORD.md):
#   Variables:  IIS_SITE_PATH (required), IIS_SITE_NAME, IIS_APP_POOL, IIS_BINDING, IIS_CERT_THUMBPRINT,
#               IIS_APP_POOL_USER, SMOKE_TEST_URL (as for the old app; unchanged)
#               APPENV_*  stamped into web.config as environment variables with the prefix removed. JBS Contracts
#                         reads the old app's names (decision D-36), so the existing QA variables work as they are:
#                           APPENV_Database__ConnectionString          (required, Windows integrated authentication)
#                           APPENV_Ecp__DataDirectory                  (required; documents and fonts live under it)
#                           APPENV_Ecp__Logging__Directory / __FileName / __RetainedFiles
#                           APPENV_Ecp__DataProtection__KeyDirectory
#                           APPENV_Ecp__Security__FailsafeAdmins__N__Account / __DisplayName / __Email  (first admins)
#               RESET_DATABASE_CONFIRM  one-off: the database name, to replace the old app's tables (then delete it)
#   Secrets:    IIS_APP_POOL_PASSWORD only if the deploy must create the app pool itself. No other secret is used.
# Only VARIABLES are stamped into web.config: a secret would end up there in clear text.
#
# Callers must pass `secrets: inherit`. Keep the PowerShell here and in scripts/ci ASCII-only.
name: Deploy to IIS (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment name (QA, Production). Also the ASPNETCORE_ENVIRONMENT value.
        type: string
        required: true
      runner-label:
        description: Label of the self-hosted runner on the target web server (iis-qa, iis-prod).
        type: string
        required: true
      preserve-folders:
        description: Space-separated folder names in the site that hold runtime data and must not be overwritten.
        type: string
        default: "logs"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: [self-hosted, windows, "${{ inputs.runner-label }}"]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SMOKE_TEST_URL }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out (deploy scripts only)
        uses: actions/checkout@v7

      - name: Download the package built for this commit
        uses: actions/download-artifact@v4
        with:
          name: jbs-contracts-package
          path: ${{ runner.temp }}/package

      - name: Deploy
        shell: powershell
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          SITE_PATH: ${{ vars.IIS_SITE_PATH }}
          SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
          ASPNET_ENV: ${{ inputs.environment }}
          PRESERVE_FOLDERS: ${{ inputs.preserve-folders }}
          SITE_NAME: ${{ vars.IIS_SITE_NAME }}
          APP_POOL: ${{ vars.IIS_APP_POOL }}
          BINDING: ${{ vars.IIS_BINDING }}
          CERT_THUMBPRINT: ${{ vars.IIS_CERT_THUMBPRINT || secrets.IIS_CERT_THUMBPRINT }}
          APP_POOL_USER: ${{ vars.IIS_APP_POOL_USER }}
          APP_POOL_PASSWORD: ${{ secrets.IIS_APP_POOL_PASSWORD }}
          RESET_CONFIRM: ${{ vars.RESET_DATABASE_CONFIRM }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SITE_PATH) { throw "Set the IIS_SITE_PATH variable on the '${{ inputs.environment }}' environment." }
          $package = Join-Path $env:RUNNER_TEMP "package"

          # APPENV_-prefixed VARIABLES only. Values are never printed, only the names.
          $appEnv = @{}
          if ($env:ALL_VARS) {
            foreach ($p in ($env:ALL_VARS | ConvertFrom-Json).PSObject.Properties) {
              if ($p.Name -like "APPENV_*") { $appEnv[$p.Name.Substring(7)] = [string]$p.Value }
            }
          }
          Write-Host "Injecting $($appEnv.Count) app setting(s): $(($appEnv.Keys | Sort-Object) -join ', ')"

          # Fail safely before anything on the server is touched.
          $connectionString = $appEnv["Database__ConnectionString"]
          if (-not $connectionString) { throw "The '${{ inputs.environment }}' environment has no APPENV_Database__ConnectionString variable." }
          if ($connectionString -match "(?i)(password|pwd)\s*=") { throw "Database__ConnectionString contains a password. Use Windows integrated authentication (no credential in the string)." }
          $dataPath = if ($appEnv["Contracts__DataDirectory"]) { $appEnv["Contracts__DataDirectory"] } else { $appEnv["Ecp__DataDirectory"] }
          if (-not $dataPath) { throw "The '${{ inputs.environment }}' environment has no APPENV_Ecp__DataDirectory (or APPENV_Contracts__DataDirectory) variable." }
          foreach ($localOnly in @("Contracts__AuthMode", "Contracts__ApplyDatabaseScripts")) {
            if ($appEnv.ContainsKey($localOnly)) { throw "APPENV_$localOnly is for local development only and must not be set on a server environment." }
          }
          $logPath = if ($appEnv["Contracts__Logging__Directory"]) { $appEnv["Contracts__Logging__Directory"] } else { $appEnv["Ecp__Logging__Directory"] }
          $keyPath = $appEnv["Ecp__DataProtection__KeyDirectory"]
          $split = { param($s) @($s -split '\s+' | Where-Object { $_ }) }

          # 1. One-off switch-over from the old app (does nothing once JBS Contracts is installed, or on an empty database).
          & "$env:GITHUB_WORKSPACE\scripts\ci\Reset-LegacyDatabase.ps1" -ConnectionString $connectionString -Confirm "$env:RESET_CONFIRM" -DataPath $dataPath

          # 2. Database scripts, as this runner's account (the migration identity), before any file is copied.
          #    Each script runs once, in a transaction, and must work with the version of the app that is still running.
          & "$env:GITHUB_WORKSPACE\scripts\ci\Invoke-SqlMigrations.ps1" -ConnectionString $connectionString -ScriptsPath (Join-Path $package "database")

          # 3. The folder for JBS's own font files (copied there by hand once; never in the repository, decision D-34).
          $fonts = Join-Path $dataPath "fonts"
          if (-not (Test-Path $fonts)) { New-Item -ItemType Directory -Path $fonts | Out-Null; Write-Host "==> Created $fonts for the JBS font files" }
          $fontCount = @(Get-ChildItem -Path $fonts -Filter *.woff2 -ErrorAction SilentlyContinue).Count
          if ($fontCount -eq 0) { Write-Host "::warning::No JBS font files in $fonts yet; the app shows Inter until JBSVariableText.woff2 and JBSVariableDisplay.woff2 are copied there." }

          # 4. Files, IIS site and certificate, then the smoke test (/health/live also checks the database).
          & "$env:GITHUB_WORKSPACE\scripts\ci\Deploy-IisSite.ps1" `
            -PackagePath (Join-Path $package "app") `
            -SitePath $env:SITE_PATH `
            -Environment $env:ASPNET_ENV `
            -EnvironmentVariables $appEnv `
            -PreserveFolders (& $split $env:PRESERVE_FOLDERS) `
            -SmokeTestUrl $env:SMOKE_TEST_URL `
            -SiteName $env:SITE_NAME `
            -AppPoolName $env:APP_POOL `
            -Binding $env:BINDING `
            -CertificateThumbprint $env:CERT_THUMBPRINT `
            -AppPoolUser $env:APP_POOL_USER `
            -AppPoolPassword $env:APP_POOL_PASSWORD `
            -DataPath $dataPath `
            -LogPath $logPath `
            -KeyPath $keyPath

      - name: Clean up package
        if: always()
        shell: powershell
        run: Remove-Item "$env:RUNNER_TEMP\package" -Recurse -Force -ErrorAction SilentlyContinue

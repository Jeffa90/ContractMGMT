# CI for JBS Contracts (jbs-contracts/). Deploy only deploys a commit whose CI run is green (deploy.yml, verify-ci).
# The old Enterprise Contract Platform's CI is in git history (tag legacy-ecp-final); its code is not built here.
# No Docker in the app or its deploy: the one container below is a throwaway SQL Server for the API tests only.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  web:
    name: Front end (lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jbs-contracts/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jbs-contracts/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    name: API (build, tests against real SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jbs-contracts
    steps:
      - uses: actions/checkout@v4
      - name: Start a throwaway SQL Server 2025 (generated password, masked)
        run: |
          set -euo pipefail
          pw="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$pw" -p 1433:1433 mcr.microsoft.com/mssql/server:2025-latest >/dev/null
          ready=no
          for i in $(seq 1 60); do
            # Ready means a real login works (the "ready" log line comes before system upgrade steps finish).
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$pw" -Q "SELECT 1" > /dev/null 2>&1; then ready=yes; break; fi
            sleep 2
          done
          if [ "$ready" != yes ]; then docker logs sql > "$RUNNER_TEMP/sql.log" 2>&1 || true; tail -20 "$RUNNER_TEMP/sql.log"; echo "::error::SQL Server did not start."; exit 1; fi
          echo "JBS_TEST_SQL=Server=localhost,1433;User Id=sa;Password=$pw;TrustServerCertificate=True;Encrypt=True" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jbs-contracts/global.json
      - name: Restore (locked)
        run: dotnet restore JbsContracts.sln --locked-mode
      - name: Build (warnings are errors; NuGet audit is a gate)
        run: dotnet build JbsContracts.sln -c Release --no-restore
      - name: Test (real SQL Server; never skipped)
        run: dotnet test --solution JbsContracts.sln -c Release --no-build

  e2e:
    name: Browser tests (phone and desktop, light and dark, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: jbs-contracts
    steps:
      - uses: actions/checkout@v4
      - name: Start a throwaway SQL Server 2025 (generated password, masked)
        run: |
          set -euo pipefail
          pw="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$pw" -p 1433:1433 mcr.microsoft.com/mssql/server:2025-latest >/dev/null
          ready=no
          for i in $(seq 1 60); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$pw" -Q "CREATE DATABASE E2E" > /dev/null 2>&1; then ready=yes; break; fi
            sleep 2
          done
          if [ "$ready" != yes ]; then echo "::error::SQL Server did not start."; exit 1; fi
          echo "E2E_SQL=Server=localhost,1433;Database=E2E;User Id=sa;Password=$pw;TrustServerCertificate=True;Encrypt=True" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: jbs-contracts/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jbs-contracts/web/package-lock.json
      - name: Build the front end and the API
        run: |
          set -euo pipefail
          (cd web && npm ci && npm run build)
          dotnet restore api --locked-mode
          dotnet build api -c Release --no-restore
      - name: Start JBS Contracts (test mode, fictional people only)
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://localhost:5091
          Contracts__AuthMode: Header
          Contracts__ApplyDatabaseScripts: "true"
          Contracts__FirstAdmins__0__Account: DEMO\amorgan
          Contracts__FirstAdmins__0__DisplayName: Alex Morgan (demo)
          Contracts__FirstAdmins__0__Email: alex.morgan@example.com
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          Database__ConnectionString="$E2E_SQL" Contracts__DataDirectory="$RUNNER_TEMP/data" \
            nohup dotnet run --project api -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5091/health/live > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          tail -40 "$RUNNER_TEMP/api.log"; echo "::error::JBS Contracts did not start."; exit 1
      - name: Install the browser
        working-directory: jbs-contracts/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: jbs-contracts/web
        env:
          E2E_BASE_URL: http://localhost:5091
        run: npm run e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            jbs-contracts/web/playwright-report
            ${{ runner.temp }}/api.log
          retention-days: 7

  checks:
    name: Repository checks (links, manifest, secrets, ASCII scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Repository consistency checks
        run: python3 -I tools/check-repo.py .
      - name: Secrets scan (a safety net, not a guarantee)
        run: python3 -I tools/check-secrets.py .
      - name: Deploy scripts are ASCII-only (Windows PowerShell 5.1 reads them as ANSI)
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' scripts/ci/*.ps1; then echo "::error::Non-ASCII characters in scripts/ci/*.ps1"; exit 1; fi
      - name: No JBS font files committed (decision D-34)
        run: |
          if git ls-files | grep -iE '\.(woff2?|eot|ttf|otf)$'; then echo "::error::Font files must not be committed (JBS fonts are licensed; this repository is public)."; exit 1; fi

# Production-shaped composition. Status: Scaffolded / Not Verified.
# SQL Server is expected to be an existing managed instance; the connection string is supplied as a SECRET FILE,
# never as an inline value. Create ./secrets/ecp-sql.txt (git-ignored) containing the connection string.
# The platform refuses to start in Production with SQLite, inline connection strings or demo features (ProductionGuard).
services:
  ecp:
    image: ecp:local
    ports:
      - "127.0.0.1:8080:8080"   # place a TLS-terminating reverse proxy in front; do not publish plain HTTP externally
    environment:
      Ecp__Mode: Production
      Ecp__DemoTenantResolution: "false"
      Ecp__DemoSeed: "false"
      # Production accepts only signed packs from a trusted publisher (docs/PACK_SIGNING.md). The shipped packs are built unsigned; sign them with your own key, mount them read-only
      # over /app/packs, and trust your public key here (or register it in the Pack Manager). Until then readiness reports the packs as Degraded.
      # Ecp__Packs__TrustFile: "/run/secrets/ecp-pack-keys.json"
      # Ecp__Packs__ShippedDirectory: "/app/packs"
      Database__Provider: SqlServer
      Database__ConnectionStringRef: "file:/run/secrets/ecp-sql"
      Database__AutoMigrate: "false"   # run `dotnet Ecp.Host.dll migrate` as a deliberate release step
      # First-run setup: the wizard answers 404 to callers that are not on the server. Through a published port, set this to "true" only while
      # you run setup (docker exec ecp dotnet Ecp.Host.dll setup-token), then remove it. The one-time token is still required.
      # Ecp__Setup__AllowRemote: "true"
      # Backup and restore (docs/BACKUP_AND_RESTORE.md, docs/OPERATIONS_RUNBOOK.md). Mount a protected directory that the database server can also write, point these at it, and keep the
      # privileged backup account in its own secret. Restores go to a new database and a new directory beside the running installation; nothing here replaces the live database.
      # Ecp__Recovery__BackupDirectory: "/var/ecp-backups"
      # Ecp__Recovery__SqlServerBackupDirectory: "/mnt/sqlbackups/ecp"        # the same directory, as the database server sees it
      # Ecp__Recovery__RestoreTargetDirectory: "/var/ecp-restore"
      # Ecp__Recovery__AdminConnectionStringRef: "file:/run/secrets/ecp-sql-backup"
      # Ecp__Recovery__StorageProtection: "Describe how this storage is encrypted and who may read it"
    secrets:
      - ecp-sql
    volumes:
      - ecp-data:/var/ecp
      # - ecp-backups:/var/ecp-backups     # protected storage shared with the database server; encrypt it and control access (the platform cannot verify this)
      # - ecp-restore:/var/ecp-restore
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
secrets:
  ecp-sql:
    file: ./secrets/ecp-sql.txt
volumes:
  ecp-data:
  # ecp-backups:
  # ecp-restore:

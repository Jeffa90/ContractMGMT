# Enterprise Contract Platform: once CI is green on the commit, build and deploy it to QA on the
# QA server's runner. Production runs only when someone starts this workflow by hand with
# promote-to-production ticked (owner decision 2026-11-25; a push never starts it), and then only
# after approval (the Production environment's Required reviewers). Each deploy
# job builds and deploys in one step (iis-deploy.yml); no workflow artifacts are stored.
# Pull-request / branch checks stay in ci.yml. Setup: docs/DEPLOYMENT.md.
#
# Database (ADR-0045): each deploy runs `deploy-migrate` as the runner account (the migration identity) before copying files.
# It creates the schema on a fresh database and does nothing on a current one; a release that would change an installed
# database stops the deploy until the upgrade runbook has been followed (docs/UPGRADE_RUNBOOK.md). After the copy,
# `setup-apply` completes first-run setup from the SETUP_ANSWERS_FILE answers file and keeps the failsafe administrators.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "requirements/**"
      - "prompts/**"
      - "decisions/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      promote-to-production:
        description: Also deploy to Production after QA succeeds (still needs the Production environment's required reviewer). Production is only deployed from main, and only from a manual run with this ticked.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # CI is not repeated here. The deployment waits for the existing CI workflow (ci.yml) to have finished GREEN on this exact commit, and does nothing otherwise.
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)"
            case "$row" in
              "completed success") echo "CI is green for $SHA."; exit 0 ;;
              "completed "*) echo "::error::CI finished as '${row#completed }' for $SHA. Nothing is deployed."; exit 1 ;;
              "") echo "No CI run found yet for $SHA (attempt $attempt)." ;;
              *) echo "CI is $row for $SHA (attempt $attempt)." ;;
            esac
            sleep 30
          done
          echo "::error::CI did not finish green within 60 minutes for $SHA. Nothing is deployed."; exit 1

  deploy-qa:
    needs: verify-ci
    uses: ./.github/workflows/iis-deploy.yml
    with:
      environment: QA
      runner-label: iis-qa
      preserve-folders: logs
    secrets: inherit

  # The same commit, built again on the Production runner (lock files pin every package version). Production only from main, only from a manual run that
  # asked for it (a push to main deploys QA only), and only after the Production environment's required reviewer approves.
  deploy-prod:
    needs: deploy-qa
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.promote-to-production
    uses: ./.github/workflows/iis-deploy.yml
    with:
      environment: Production
      runner-label: iis-prod
      preserve-folders: logs
    secrets: inherit
